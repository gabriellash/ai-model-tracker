# Checks every pull request (including flagged daily-update PRs) before it can be merged.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/validate.mjs
      - run: npm test
      - run: node scripts/build.mjs
