# Builds and publishes the site to GitHub Pages. Validation and tests run first:
# if either fails nothing is deployed and the live site keeps its previous data.
name: deploy

on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # Called by daily-update.yml: pushes made with GITHUB_TOKEN do not trigger other workflows.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
